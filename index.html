</head>

                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Right: Map */}
                        <div className="flex-1 relative" style={{ background: 'linear-gradient(135deg, #000000 0%, #001a1a 50%, #000033 100%)' }}>
                            {/* Scan line - only on map */}
                            <div className="scan-line pointer-events-none z-40"></div>
                            
                            {/* Location Badge */}
                            <div className="absolute top-6 left-1/2 -translate-x-1/2 px-5 py-2 rounded-lg border-2 border-cyan-500 z-20"
                                 style={{ 
                                     background: 'rgba(0, 0, 0, 0.9)',
                                     boxShadow: '0 0 30px rgba(0, 255, 255, 0.6)',
                                 }}>
                                <div className="flex items-center gap-2">
                                    <div className="w-2 h-2 rounded-full bg-cyan-400 neon-glow"></div>
                                    <span className="font-bold text-cyan-300 uppercase text-sm font-mono">GREENSBORO, NC</span>
                                    <span className="text-xs text-cyan-600 font-mono">36.0726°N 79.7920°W</span>
                                </div>
                            </div>

                            {/* Map SVG */}
                            <svg className="absolute inset-0 w-full h-full">
                                <defs>
                                    <pattern id="techGrid" width="60" height="60" patternUnits="userSpaceOnUse">
                                        <path d="M 60 0 L 0 0 0 60" fill="none" stroke="cyan" strokeWidth="0.5" opacity="0.2"/>
                                        <circle cx="0" cy="0" r="1" fill="cyan" opacity="0.3"/>
                                    </pattern>
                                </defs>
                                <rect width="100%" height="100%" fill="url(#techGrid)" opacity="0.3" />

                                <circle cx="50%" cy="50%" r="30" fill="none" stroke="cyan" strokeWidth="2" opacity="0.2" className="pulse-slow" />
                                <circle cx="50%" cy="50%" r="20" fill="none" stroke="cyan" strokeWidth="1" opacity="0.4" className="pulse-slow" />
                                <circle cx="50%" cy="50%" r="8" fill="cyan" style={{ filter: 'drop-shadow(0 0 10px cyan)' }} />
                                
                                {groceryStores.map((store, idx) => {
                                    const pos = positions[idx];
                                    const isSelected = selectedStore?.id === store.id;
                                    
                                    return (
                                        <g key={store.id}>
                                            <line 
                                                x1="50%" 
                                                y1="50%" 
                                                x2={pos.x} 
                                                y2={pos.y} 
                                                stroke={isSelected ? 'cyan' : '#4A5568'} 
                                                strokeWidth={isSelected ? '3' : '2'}

                                                opacity={isSelected ? '0.8' : '0.3'}
                                                style={{ 
                                                    filter: isSelected ? 'drop-shadow(0 0 8px cyan)' : 'none',
                                                    transition: 'all 0.3s'
                                                }}
                                            />
                                            <circle 
                                                cx={pos.x} 
                                                cy={pos.y} 
                                                r={isSelected ? '14' : '10'}
                                                fill={isSelected ? 'cyan' : '#6B7280'}
                                                style={{ 
                                                    filter: isSelected ? 'drop-shadow(0 0 15px cyan)' : 'none',
                                                    transition: 'all 0.3s',
                                                    cursor: 'pointer'
                                                }}
                                                onClick={() => setSelectedStore(store)}
                                            />
                                            {isSelected && (
                                                <circle 
                                                    cx={pos.x} 
                                                    cy={pos.y} 
                                                    r="22" 
                                                    fill="none"
                                                    stroke="cyan" 
                                                    strokeWidth="2"
                                                    opacity="0.4"
                                                    className="pulse-slow"
                                                />
                                            )}
                                        </g>
                                    );
                                })}
                            </svg>

                            {/* Store info cards on map */}
                            {groceryStores.map((store, idx) => {
                                const mapPos = [
                                    { top: '20%', left: '25%' },
                                    { top: '25%', right: '20%' },
                                    { bottom: '25%', right: '15%' },
                                    { bottom: '20%', left: '30%' }
                                ][idx];
                                const isSelected = selectedStore?.id === store.id;
                                
                                return (
                                    <div
                                        key={store.id}
                                        className={`absolute rounded-lg p-3 transition-all cursor-pointer ${
                                            isSelected ? 'scale-110 border-2 border-cyan-400' : 'border border-gray-700'
                                        }`}
                                        style={{ 
                                            ...mapPos,
                                            transform: `translate(-50%, -50%) ${isSelected ? 'scale(1.1)' : 'scale(1)'}`,
                                            background: isSelected ? 
                                                'linear-gradient(135deg, rgba(0, 255, 255, 0.2) 0%, rgba(0, 0, 0, 0.95) 100%)' :
                                                'rgba(0, 0, 0, 0.8)',
                                            boxShadow: isSelected ? 
                                                '0 0 30px rgba(0, 255, 255, 0.6)' :
                                                '0 4px 6px rgba(0, 0, 0, 0.5)',
                                            zIndex: isSelected ? 30 : 20,
                                            minWidth: '130px',
                                            backdropFilter: 'blur(10px)'
                                        }}
                                        onClick={() => setSelectedStore(store)}
                                    >
                                        <div className="text-xs font-bold text-cyan-300 uppercase mb-1 font-mono">{store.name}</div>
                                        <div className="text-xs text-gray-400 font-mono">{store.distance}</div>
                                        <div className="flex items-center justify-between mt-1">
                                            <span className="text-xs font-bold text-yellow-400 font-mono">{store.priceLevel}</span>
                                            <span className="text-xs text-green-400 font-mono">${store.avgSpend}</span>
                                        </div>
                                    </div>
                                );
                            })}

                            {/* Price Legend */}
                            <div className="absolute bottom-6 right-6 rounded-lg p-4 z-20 border border-cyan-700"
                                 style={{ 
                                     background: 'rgba(0, 0, 0, 0.9)',
                                     boxShadow: '0 0 20px rgba(0, 255, 255, 0.3)',
                                     backdropFilter: 'blur(10px)'
                                 }}>
                                <div className="text-xs font-bold text-cyan-400 mb-2 uppercase tracking-wide">PRICE MATRIX</div>
                                <div className="space-y-1 text-xs">
                                    <div className="flex items-center gap-2">
                                        <span className="font-bold w-6 text-yellow-400 font-mono">$</span>
                                        <span className="text-gray-400 font-mono">BUDGET</span>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <span className="font-bold w-6 text-yellow-400 font-mono">$$</span>
                                        <span className="text-gray-400 font-mono">MID</span>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <span className="font-bold w-6 text-yellow-400 font-mono">$$$</span>
                                        <span className="text-gray-400 font-mono">PREMIUM</span>
                                    </div>
                                </div>
                            </div>

                            {/* Selected Store Panel */}
                            {selectedStore && (
                                <div className="absolute bottom-0 left-0 right-0 border-t-4 border-cyan-400 p-5 notification-enter"

                                         backdropFilter: 'blur(20px)'

                                                     style={{ boxShadow: '0 0 20px rgba(0, 255, 255, 0.5)' }}>
                                                    🏪
                                                </div>
                                                <div>
                                                    <h3 className="font-bold text-2xl mb-1 text-cyan-300 uppercase tracking-wide">{selectedStore.name}</h3>
                                                    <div className="text-sm text-gray-400 mb-2 font-mono">
                                                        DIST: {selectedStore.distance} | CAT: {selectedStore.category.toUpperCase()}
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <span className="text-xs bg-green-900 text-green-300 px-2 py-1 rounded border border-green-500 font-mono">
                                                            {selectedStore.savings}
                                                        </span>
                                                        <span className="text-xs bg-blue-900 text-blue-300 px-2 py-1 rounded border border-blue-500 font-mono">
                                                            ⚡ {selectedStore.deals}
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>
                                            <button
                                                onClick={() => setSelectedStore(null)}
                                                className="text-cyan-400 hover:text-cyan-300 text-xl"
                                            >
                                                ✕
                                            </button>
                                        </div>
                                        <div className="flex gap-3">
                                            <button 
                                                className="flex-1 py-3 rounded text-black font-bold uppercase tracking-wide bg-cyan-400 border-2 border-cyan-400"
                                                style={{ boxShadow: '0 0 20px rgba(0, 255, 255, 0.6)' }}
                                            >
                                                📍 NAVIGATE
                                            </button>
                                            <button 
                                                className="flex-1 py-3 rounded font-bold border-2 border-cyan-500 text-cyan-400 hover:bg-cyan-950 uppercase tracking-wide transition"
                                            >
                                                🏷️ VIEW DEALS
                                            </button>
                                            <button 
                                                className="flex-1 py-3 rounded font-bold border-2 border-purple-500 text-purple-400 hover:bg-purple-950 uppercase tracking-wide transition"
                                            >
                                                💰 COMPARE
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );

            const GigWorkView = () => {
                const [selectedGig, setSelectedGig] = useState(null);
                
                return (
                <div className="fixed inset-0 top-16 bottom-20 flex page-enter">
                    {/* Left Menu - Gig Opportunities */}
                    <div className="w-96 bg-white border-r border-gray-200 overflow-y-auto relative z-10">
                        <div className="p-6 border-b border-gray-200 sticky top-0 bg-white z-20">
                            <h2 className="text-2xl font-bold flex items-center gap-2">
                                <span>💼</span>
                                Gig Opportunities
                            </h2>
                            <p className="text-sm text-gray-600 mt-1">Select a gig to see details</p>
                        </div>
                        
                        <div className="p-4 space-y-2">
                            {gigOpportunities.map((gig, idx) => (
                                <div
                                    key={gig.id}
                                    onClick={() => setSelectedGig(gig.id)}
                                    className={`p-4 rounded-xl cursor-pointer transition-all notification-enter ${
                                        selectedGig === gig.id
                                            ? 'bg-gradient-to-r shadow-lg scale-[1.02]'
                                            : 'bg-gray-50 hover:bg-gray-100'
                                    }`}
                                    style={{
                                        animationDelay: `${idx * 0.1}s`,
                                        ...(selectedGig === gig.id && {
                                            backgroundImage: 'linear-gradient(135deg, #E6F3FF 0%, #CCE7FF 100%)',
                                            borderLeft: `4px solid ${theme.primary}`
                                        })
                                    }}
                                >
                                    <div className="flex items-start gap-3">
                                        <div className="text-3xl">{gig.icon}</div>
                                        <div className="flex-1 min-w-0">
                                            <h3 className="font-semibold text-base mb-1">{gig.name}</h3>
                                            <p className="text-xs text-gray-600 mb-2">{gig.description}</p>
                                            <div className="bg-green-50 px-2 py-1 rounded-full inline-block">
                                                <span className="text-green-700 font-bold text-xs">{gig.earning}</span>
                                            </div>
                                        </div>
                                        {selectedGig === gig.id && (
                                            <div className="text-sm" style={{ color: theme.primary }}>→</div>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                            {/* Floating graph lines */}
                            <svg className="floating-graph-line" style={{ top: '15%', animationDuration: '25s', animationDelay: '0s' }} viewBox="0 0 1000 100" preserveAspectRatio="none">
                                <path d="M0,50 Q250,20 500,50 T1000,50" stroke="#4ECDC4" strokeWidth="3" fill="none" opacity="0.4"/>
                            </svg>
                            <svg className="floating-graph-line" style={{ top: '35%', animationDuration: '30s', animationDelay: '5s' }} viewBox="0 0 1000 100" preserveAspectRatio="none">
                                <path d="M0,50 Q250,80 500,50 T1000,50" stroke="#FF6B9D" strokeWidth="3" fill="none" opacity="0.4"/>
                            </svg>
                            <svg className="floating-graph-line" style={{ top: '55%', animationDuration: '28s', animationDelay: '10s' }} viewBox="0 0 1000 100" preserveAspectRatio="none">
                                <path d="M0,50 Q250,30 500,60 T1000,50" stroke="#FFD93D" strokeWidth="3" fill="none" opacity="0.4"/>
                            </svg>
                            <svg className="floating-graph-line" style={{ top: '75%', animationDuration: '32s', animationDelay: '15s' }} viewBox="0 0 1000 100" preserveAspectRatio="none">
                                <path d="M0,50 Q250,70 500,40 T1000,50" stroke="#A8E6CF" strokeWidth="3" fill="none" opacity="0.4"/>
                            </svg>
                        </div>
                        
                        <div className="h-full flex items-end justify-around p-12 gap-8 relative z-10">
                            {gigOpportunities.map((gig, idx) => (
                                <div key={gig.id} className="flex flex-col items-center gap-4 relative" style={{ flex: 1 }}>
                                    {/* Bar Graph */}
                                    <div className="relative w-full" style={{ height: '400px' }}>
                                        <div 
                                            className="bar-graph absolute left-1/2 transform -translate-x-1/2"
                                            style={{
                                                '--bar-color': idx === 0 ? '#FF6B9D' : idx === 1 ? '#4ECDC4' : idx === 2 ? '#FFD93D' : '#A8E6CF',
                                                '--bar-color-light': idx === 0 ? '#FFB6D9' : idx === 1 ? '#95E1D3' : idx === 2 ? '#FFF176' : '#DCEDC8',
                                                '--min-height': `${100 + idx * 30}px`,
                                                '--max-height': `${300 + idx * 20}px`,
                                                animationDuration: `${6.75 + idx * 1.125}s`,
                                                animationDelay: `${idx * 0.3}s`
                                            }}
                                        >
                                            {/* Icon on top of bar */}
                                            <div className="absolute -top-16 left-1/2 transform -translate-x-1/2 text-5xl">
                                                {gig.icon}
                                            </div>
                                        </div>
                                    </div>
                                    
                                    {/* Label */}
                                    <div className="text-center">
                                        <div className="font-bold text-gray-800 text-sm">{gig.name}</div>
                                        <div className="text-xs text-gray-600 mt-1">{gig.earning}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                        
                        {/* Title overlay */}
                        <div className="absolute top-8 left-8 z-20">
                            <h2 className="text-3xl font-bold text-gray-800 mb-2">Earning Potential</h2>
                            <p className="text-gray-600">Watch the bars rise and fall based on demand</p>
                        </div>
                    </div>
                </div>
            );
            };

            return (
                <div className="min-h-screen theme-transition pb-20" style={{ backgroundColor: theme.bg }}>
                    {/* Header with gradient */}
                    <div className="theme-transition shadow-lg relative overflow-hidden" style={{ 
                        background: `linear-gradient(135deg, ${theme.primary} 0%, ${theme.accent} 100%)` 
                    }}>
                        <div className="absolute inset-0 opacity-10">
                            <div className="absolute top-0 right-0 w-40 h-40 bg-white rounded-full blur-3xl"></div>
                        </div>
                        <div className="max-w-md mx-auto px-4 py-5 relative z-10">
                            <div className="flex justify-between items-center">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center text-2xl shadow-lg float-animation">
                                        📈
                                    </div>
                                    <h1 className="text-white text-2xl font-bold">Budgetly</h1>
                                </div>
                                <select 
                                    value={currentTheme}
                                    onChange={(e) => setCurrentTheme(e.target.value)}
                                    className="px-4 py-2 rounded-lg text-sm font-medium shadow-lg hover:shadow-xl transition cursor-pointer"
                                >
                                    <option value="chase">🏦 Chase</option>
                                    <option value="fidelity">💼 Fidelity</option>
                                    <option value="kpmg">📊 KPMG</option>
                                    <option value="cashapp">💚 Cash App</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    {/* Main Content */}
                    {currentView === 'ai' || currentView === 'dashboard' || currentView === 'notifications' ? (
                        currentView === 'ai' ? <AIShoppingView /> : 
                        currentView === 'dashboard' ? <DashboardView /> :
                        <NotificationsView />
                    ) : (
                        <div className="pt-24 max-w-md mx-auto px-4 py-6">
                            {currentView === 'gigs' ? (
                                <GigWorkView />
                            ) : null}
                        </div>
                    )}

                    {/* Bottom Navigation */}
                    <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-2xl z-50">
                        <div className="max-w-md mx-auto px-2 py-2">
                            <div className="flex justify-around items-center">
                                <button 
                                    onClick={() => setCurrentView('dashboard')}
                                    className={`flex flex-col items-center gap-1 px-3 py-2 rounded-xl transition-all ${
                                        currentView === 'dashboard' ? 'font-bold scale-110' : 'opacity-60'
                                    }`}
                                    style={{ 
                                        color: currentView === 'dashboard' ? theme.primary : '#6B7280',
                                        backgroundColor: currentView === 'dashboard' ? `${theme.primary}15` : 'transparent'
                                    }}
                                >
                                    <span className="text-2xl">{currentView === 'dashboard' ? '🏠' : '🏡'}</span>
                                    <span className="text-xs">Home</span>
                                </button>
                                
                                <button 
                                    onClick={() => setCurrentView('notifications')}
                                    className={`flex flex-col items-center gap-1 px-3 py-2 rounded-xl transition-all relative ${
                                        currentView === 'notifications' ? 'font-bold scale-110' : 'opacity-60'
                                    }`}
                                    style={{ 
                                        color: currentView === 'notifications' ? theme.primary : '#6B7280',
                                        backgroundColor: currentView === 'notifications' ? `${theme.primary}15` : 'transparent'
                                    }}
                                >
                                    <span className="text-2xl">{currentView === 'notifications' ? '🔔' : '🔕'}</span>
                                    <span className="text-xs">Alerts</span>
                                    <span className="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full pulse"></span>
                                </button>
                                
                                <button 
                                    onClick={() => setCurrentView('ai')}
                                    className={`flex flex-col items-center gap-1 px-3 py-2 rounded-xl transition-all ${
                                        currentView === 'ai' ? 'font-bold scale-110' : 'opacity-60'
                                    }`}
                                    style={{ 
                                        color: currentView === 'ai' ? theme.primary : '#6B7280',
                                        backgroundColor: currentView === 'ai' ? `${theme.primary}15` : 'transparent'
                                    }}
                                >
                                    <span className="text-2xl">🤖</span>
                                    <span className="text-xs">AI Shop</span>
                                </button>
                                
                                <button 
                                    onClick={() => setCurrentView('gigs')}
                                    className={`flex flex-col items-center gap-1 px-3 py-2 rounded-xl transition-all ${
                                        currentView === 'gigs' ? 'font-bold scale-110' : 'opacity-60'
                                    }`}
                                    style={{ 
                                        color: currentView === 'gigs' ? theme.primary : '#6B7280',
                                        backgroundColor: currentView === 'gigs' ? `${theme.primary}15` : 'transparent'
                                    }}
                                >
                                    <span className="text-2xl">💼</span>
                                    <span className="text-xs">Gigs</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
